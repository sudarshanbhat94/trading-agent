name: tests

# The repo had no automation at all: 600 tests that only ever ran when someone
# remembered to run them. This is the safety net for a service that manages a
# live paper book.
on:
  push:
  pull_request:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      # Do not stop the other version the moment one fails — knowing whether a
      # failure is version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # 3.12 is what the deploy box runs; 3.14 is the development
        # environment. Testing both catches drift between them.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Deliberately requirements.txt ONLY. If a module the app imports is
        # not declared here, the suite must fail — that exact gap once shipped
        # a box that booted with no trading engine at all.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
